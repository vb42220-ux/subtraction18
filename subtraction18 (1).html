<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>18以內不借位減法</title><style>
*{box-sizing:border-box}body{margin:0;background:#f0f7fc;color:#24364b;font-family:"Microsoft JhengHei",sans-serif}main{max-width:900px;margin:auto;padding:20px}h1{font-size:clamp(24px,4vw,36px);margin:6px 0}button,select{font:inherit;font-size:20px;border-radius:14px;padding:14px;border:2px solid #8aabc4;background:white;color:#24364b;min-height:58px;cursor:pointer}button:focus-visible,select:focus-visible{outline:4px solid #f0a500;outline-offset:3px}button:disabled{cursor:default}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.card{background:white;border-radius:22px;padding:20px;margin:16px 0;box-shadow:0 4px 16px #20395412}.question{text-align:center;font-size:clamp(42px,8vw,68px);font-weight:bold;margin:8px}.steps{display:flex;gap:8px;flex-wrap:wrap}.steps span{background:#edf3fa;padding:10px;border-radius:12px}.board{display:grid;grid-template-columns:1fr 1fr;text-align:center;border:2px solid #a6bfd3;border-radius:16px;overflow:hidden;margin:14px 0}.column{padding:12px}.column:first-child{background:#eaf3ff;border-right:2px solid #a6bfd3}.column:last-child{background:#fff4df}.digit{font-size:40px;font-weight:bold}.dots{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:300px;margin:12px auto}.dot{aspect-ratio:1;border:2px solid #7e9cb3;border-radius:10px;display:grid;place-items:center}.dot.full:before{content:"";width:70%;height:70%;border-radius:50%;background:#226eaa}.dot.gone:before{background:#bbb}.dot.gone{position:relative}.dot.gone:after{content:"×";position:absolute;color:#be2435;font-size:40px;font-weight:bold}.ten{border:3px solid #226eaa;border-radius:12px;padding:6px;margin:12px auto;max-width:300px}.ten .dots{margin:0}.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.answers button{font-size:40px;background:#eaf4ff;border:3px solid #347ba8;min-height:95px}.answers button.correct{background:#d8f2dd;border-color:#38824a}.primary{background:#226eaa;color:white;border-color:#226eaa}.feedback{text-align:center;font-size:24px;min-height:65px;margin:14px 0;font-weight:bold}.status{font-size:20px;margin:14px 0}.hidden{display:none}p{line-height:1.7}.hinttext{text-align:center;font-size:22px}small{display:block;font-size:16px;line-height:1.6} @media(max-width:500px){main{padding:12px}.card{padding:12px}.column{padding:8px}.dot.gone:after{font-size:28px}.answers{gap:8px}}
</style></head><body><main><h1>🌟 18 以內不借位減法</h1><p>先看點數 → 拿走 → 選出剩下的數量</p><div class="toolbar"><label for="level">練習範圍：</label><select id="level"><option value="teen">10～18 減一位數</option><option value="small">10 以內</option><option value="all">18 以內混合</option></select><button id="voice">🔊 聽題目</button><button id="toggle">隱藏提示</button><button id="reset">重新開始</button></div><div class="status" id="score" aria-live="polite"></div><section class="card"><div class="question" id="question"></div><div id="hints"><div class="steps"><span>① 看原來有幾個</span><span>② 拿走指定數量</span><span>③ 數剩下幾個</span></div><div class="board"><div class="column"><strong>十位</strong><div class="digit" id="tens"></div><div id="tenvisual"></div><small id="tennote"></small></div><div class="column"><strong>個位</strong><div class="digit" id="ones"></div><div class="dots" id="dots"></div><small>藍色是剩下的<br>灰色 × 是拿走的</small></div></div><p class="hinttext" id="hinttext"></p><button id="take" class="primary">✋ 一次拿走 1 個</button><button id="show">看拿走結果</button></div><p style="text-align:center">選出答案：</p><div class="answers" id="answers"></div><div class="feedback" id="feedback" role="status" aria-live="polite"></div><button id="next" class="primary" disabled>下一題 →</button></section><small>教師提示：可先使用點數提示，再隱藏提示練習。每回合 10 題；答錯可再選。語音使用瀏覽器內建朗讀，聲音依裝置而異。</small></main><script>
const $=id=>document.getElementById(id);let q,removed=0,solved=false,count=0,stars=0,deck=[],hints=true;
function makePool(level){const p=[];for(let a=1;a<=18;a++){if(level==='teen'&&a<10||level==='small'&&a>10)continue;for(let b=1;b<=Math.min(a,9);b++)if(a%10>=b%10)p.push({a,b});}return p;}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function say(t){if(!('speechSynthesis'in window)){ $('feedback').textContent='此裝置不支援語音，請看畫面題目。';return;}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='zh-TW';u.rate=.8;speechSynthesis.speak(u);}
function render(){let n=q.a%10;$('tens').textContent=Math.floor(q.a/10);$('ones').textContent=n+' − '+q.b;$('tenvisual').innerHTML=q.a>=10?'<div class="ten"><div class="dots">'+Array.from({length:10},()=>'<span class="dot full"></span>').join('')+'</div><strong>1 個十＝10</strong></div>':'';$('tennote').textContent=q.a>=10?'十位不動，保留 1 個十':'沒有十位';$('dots').innerHTML=Array.from({length:10},(_,i)=>'<span class="dot '+(i<n?(i>=n-removed?'full gone':'full'):'')+'"></span>').join('');$('hinttext').textContent=removed<q.b?'要拿走 '+q.b+' 個，已拿走 '+removed+' 個。':'拿走完成！數一數剩下的藍色點。';$('take').disabled=removed>=q.b;$('show').disabled=removed>=q.b;}
function next(){if(count>=10){$('question').textContent='🎉 完成 10 題！';$('hints').classList.add('hidden');$('answers').innerHTML='';$('feedback').textContent='你得到 '+stars+' 顆星星！';$('next').disabled=true;return;}q=deck.pop();removed=0;solved=false;$('hints').classList.toggle('hidden',!hints);$('question').textContent=q.a+' − '+q.b+' ＝ ？';$('feedback').textContent='';$('next').disabled=true;let correct=q.a-q.b;let others=shuffle(Array.from({length:19},(_,i)=>i).filter(i=>i!==correct&&Math.abs(i-correct)<=4)).slice(0,2);$('answers').innerHTML='';shuffle([correct,...others]).forEach(v=>{let btn=document.createElement('button');btn.textContent=v;btn.setAttribute('aria-label','答案 '+v);btn.onclick=()=>answer(v,btn);$('answers').appendChild(btn)});$('score').textContent='第 '+(count+1)+' / 10 題　⭐ '+stars;render();}
function answer(v,btn){if(solved)return;if(v!==q.a-q.b){$('feedback').textContent='再試一次！可以先拿走，再數剩下的。';say('再試一次');return;}solved=true;removed=q.b;render();stars++;count++;btn.classList.add('correct');Array.from($('answers').children).forEach(b=>b.disabled=true);$('question').textContent=q.a+' − '+q.b+' ＝ '+v;$('feedback').textContent='✅ 答對了！剩下 '+v+' 個。';$('score').textContent='已完成 '+count+' / 10 題　⭐ '+stars;$('next').disabled=false;$('next').textContent=count===10?'看練習成果 🌟':'下一題 →';say('答對了！'+q.a+' 減 '+q.b+' 等於 '+v);}
function start(){if('speechSynthesis'in window)speechSynthesis.cancel();count=0;stars=0;deck=shuffle(makePool($('level').value));$('next').textContent='下一題 →';next();}
$('take').onclick=()=>{if(removed<q.b){removed++;render();}};$('show').onclick=()=>{removed=q.b;render();};$('next').onclick=next;$('reset').onclick=start;$('level').onchange=start;$('voice').onclick=()=>say(count===10?'完成十題練習':q.a+' 減 '+q.b+' 等於多少？');$('toggle').onclick=()=>{hints=!hints;$('hints').classList.toggle('hidden',!hints||count===10);$('toggle').textContent=hints?'隱藏提示':'顯示提示';};start();
</script></body></html>
